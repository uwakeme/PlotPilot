version: 5.9.0-chapter-mode
name: PlotPilot 内置
description: CPMS v5 统一提示词库 — 全节点中文提示词、统一注册表、消除硬编码
author: PlotPilot Team
engine: jinja2
changelog: 'v5.9.0: 新增 planning-chapter-mode 节点（D-01），把「本章是否应为余韵章」从代码阈值（tension>=80）交回 AI 判定，判定结果接入 StoryPipeline 的 needs_buffer；v5.8.0: 新增 planning-context-weights 节点（D-02），由 AI 判断本章最需要哪几类记忆并给出槽位权重(0-1)，代码在 tier 预算内换算成 token，硬上限保持为代码不变量；v5.7.0: planning-quick-macro 移除公式推荐网格（建议共 N 部 × 每部 N 卷 × 每卷 N 幕 × 每幕 M 章），部/卷/幕/章的层数与每层章数改由 LLM 依据剧情容量自行决定，唯一硬约束为各级 estimated_chapters 之和等于 target_chapters；rec_parts 等 5 个网格变量模板不再引用，仅保留兼容定义；v5.6.0: 伏笔抽取新增 emotional_weight 与 binding_level 输出字段（chapter-narrative-sync 与 chapter-state-extraction 两条种植路径），支撑 viewpoint_guardrail 的伏笔绑定层级校验；v5.5.0: chapter-narrative-sync 新增 causal_edge_context 变量与 closed_causal_edge_ids 输出，因果边闭环判定从字符串匹配改为 LLM 判定（中文下字符串匹配实测闭环率 0.07%，bigram/滑窗方案同样失效）；v5.4.0: 新增 setting-drift-audit 节点（章后校验正文 vs Bible/FactLock 设定漂移，A1）；v5.3.7: bible-worldbuilding 包声明补齐 fields_desc 与 genre_opening_profile（runtime provider 已提供但契约未声明，修复契约完整性测试）；v5.3.6: 新书引导全面切换到变量中心 dotted key，Bible/主线候选/剧情总纲模板移除运行时代码派生变量与 request.variables 事实源；v5.3.5: 新增情绪账本增量提取节点，移除运行时隐藏硬编码提示词；v5.3.4: 新增章节 AI 审阅节点，场景生成节点补齐 Bible 与检索上下文变量；v5.3.3: 连续规划主链路迁移到 PromptGateway，新增精密宏观规划、单卷补全、缺字段修补和下一幕规划节点；v5.3.2: 补齐 memory-extraction 与 voice-baseline-analysis 包，修复变量契约，接入 PromptGateway 最小契约渲染；v5.3.1: 强化作者原始输入、题材赛道与世界观基调的最高优先级，弱化固定爆款套路；v5.3: 补齐DAG联动节点提示词，提示词广场成为DAG提示词唯一编辑源；v5.2: Bible提示词全面优化；v5.1: 新增outline-beat-partition；v5: CPMS统一架构'
