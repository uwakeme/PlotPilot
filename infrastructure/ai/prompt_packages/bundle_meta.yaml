version: 5.31.0-e04-wuxia-audit
name: PlotPilot 内置
description: CPMS v5 统一提示词库 — 全节点中文提示词、统一注册表、消除硬编码
author: PlotPilot Team
engine: jinja2
changelog: 'v5.31.0: 新增 wuxia-style-audit 节点（E-04）：武侠题材的「战斗逻辑」与「现代口语」判定改由 LLM 审——此前是代码用两条正则（「一招秒杀」）+ 恰 7 个词的现代语黑名单判的，词表外的写法一律漏报，而真正违反战斗逻辑的写法反而抓不到；现在 AI 看本章正文判断「有没有违反武功逻辑」「有没有现代口语」，代码只做不越界校验（type 封闭枚举 / 证据必须逐字出现在正文里 / 有结论必须有依据）；AI 不可用时回落代码表（改造前逐位一致），来源可分辨；另：武侠管线删掉 4 个从未生效的常量（DEFAULT_TARGET_WORDS=3000 / MIN_PASS_SCORE=0.55 / COMBAT_SCENE_MAX_WORDS / CULTIVATION_DETAIL_LEVEL）——生产的章节目标字数取自 StoryPipelineRunner（基类 2500），质量门槛真值是 policy_validator / quality_guardrail 的 0.6，那个 0.55 从未被读 ⇒「武侠门槛更低」是假的；v5.30.0: 新增 evolution-dead-character-check 节点（H-01）：死亡角色在大纲里的出场方式改由 AI 判——此前闸门的 DEAD_CHARACTER_REAPPEARS 规则只看「名字有没有出现在大纲里」⇒「回忆 / 遗物 / 传闻」一律被误判成「活跃登场」（而规则自己的建议「改为回忆/遗物/传闻」并不能满足它，规则自相矛盾）；现在 AI 看大纲上下文判断「他在当下时间线行动」还是「只是被想起」；代码只做不越界校验（角色白名单 / verdict 封闭枚举 / 有结论必须有依据）；AI 判不出 ⇒ 显式 level=unassessed（不等于「没违规」，报告里 unassessed_count 可数）；AI 不可用 ⇒ 回落规则判定（命中即拦，与改造前逐位一致，不放宽闸门）；闸门 check() 保持同步（三个调用点里有一个在纯同步方法里），AI 判定走新增的 check_with_ai / classify_dead_characters（async 侧调用方下传）；v5.29.0: 新增 planning-macro-breakpoint 节点（H-06 子项 A）：宏观诊断的**断点分类**改由 AI 判——此前「哪些事件偏离了人设、属于哪一类」全由代码判：发现靠一张写死 4 个人设标签的标签求交表（表外的人设一个断点都发现不了，而生产路径恰好只扫那 4 个标签 ⇒ 诊断对象与本书角色无关），分类靠 scar/执念两条规则、其余一律落 OOC（含「没有人物状态仓储 / 提不出角色 / 没有角色状态 / 没找到触发原因」这四种信息不足的情形 ⇒ 把「判不出」说成了「人设崩塌」）；现在 AI 看角色档案（人设/伤疤/执念）与最近的事件清单来判断，代码只做不越界校验（事件白名单 / 角色白名单 / verdict 封闭枚举 / 有结论必须有依据）；规则判不出的一律落新的 UNASSESSED（未评估），不再落 OOC；AI 不可用时回落规则判定且来源可分辨（breakpoint_source = ai / rule / 未评估）；另：planning-macro-calibration 送进提示词的断点字段名由「规则分类」改为「分类 + 分类来源」（分类现在可能来自 AI）；v5.28.0: 新增 planning-first-act 节点（C-07）：全书首幕的标题/描述/建议章数改由 AI 决定——此前 daemon 动态补首幕时这三项全部代码写死（「第一幕 · 开端」「故事起始，建立世界观与主角目标」+ 公式章数），创作判断被写成了常量；AI 不可用时落代码兜底文案，且落库来源如实保持 DRAFT/MANUAL（不标成 AI 规划好的）；v5.27.0: 新增 planning-target-budget-proposal 节点（J-01）：目标章数与终局预算的提案改由 AI 给——此前是代码写死的常量公式（max(20, round(target*0.2))），而「这本书还差多少章收得住」「终局该留几章」是创作判断；AI 不可用或说不出来时回落引擎默认公式（与改造前逐位相同），并用 source 标出 ai / fallback；终局预算的 [5,200] 上限仍由 domain 钳制，AI 动不了；v5.26.0: F-12 机械活 —— ① 8 个内置提示词包的 `source:` 指向**已不存在的**`infrastructure/ai/prompts/prompts_defaults.json`（提示词早已迁到 CPMS），该字段会透出到提示词广场 ⇒ 读者看到的是假来源；现改指真实归属文件；② 全仓「35+ 模式」这个旧数改正为「50+」（扫描器实测 51 条内置模式，「35+」是早期 10 条时代的遗留说法）；v5.25.0: chapter-prose-generation 节点新增 chapter_context 变量（X1）：生产正文提示词此前只有 target_words / chapter_outline / continuity_context 三个变量，且「近3章承接摘要」与「硬事实」挤在同一个槽位（continuity_context）——前者恒非空（continuity ledger 空时返回「暂无近3章承接摘要。」）⇒ 后者永远进不了提示词 ⇒ 模型写正文时看不见死亡锁、角色当前状态、创作契约；现在硬事实独立成 chapter_context 变量（与 continuity_context 分开），且**只送槽位级的硬事实小块**（默认：绝对事实边界 / 角色锚点 / 创作契约，每块带上限）——不送整包：正文模板的硬约束是「以七段结构为唯一剧情骨架」，且整包实测 6.9k~19.4k token/章（其中 fact_lock 在 529 章本上就有 20365 字，它自己在无上限地长）；槽位与上限见 config/performance.yaml 的 prose_context 段；v5.24.0: 新增 conflict-action-extraction 节点（H-02b）：冲突检测的「实体-动作对」改由 LLM 抽——旧实现是代码用一张写死的关键词表猜（「火球」「拔剑」…共 12 条），表里没有的写法一律漏报，且「什么算用了火系魔法」是代码代做的语义判断；现在 AI 看大纲抽出「谁做了什么」（kind 封闭枚举：magic/weapon；魔法值统一「X系」形式，与设定库 magic_type 同口径；武器值写武器名），代码只做不越界校验（实体白名单、kind 封闭枚举、值格式、证据必须字面出现在大纲里）；AI 合法地说「这段没有动作」不算未评估、不回退，调用失败/输出不合契约/给的全是废数据 ⇒ 未评估 ⇒ 回落代码关键词表（与改造前逐位一致）且来源可分辨；v5.23.0: 新增 anti-ai-pattern-induction 节点（F-06）：「本书特有的 AI 味表达」改由 LLM 归纳——旧实现是代码用 6 个固定模板正则 + 7 个固定触发词做统计，那不是学习，且「什么算 AI 味」本身是代码代做的语义判断；现在代码只做不越界校验（纯字面关键词、必须在本章正文里确实出现、严重度白名单），通过的规则落库（新表 anti_ai_learned_patterns，规则库版本化）并回灌进扫描器 ⇒ 归纳出来的模式下一章起真的会被检测到；AI 不可用时不产生任何模式；v5.22.0: 新增 foreshadow-selection 节点（D-03 P1）：本章该推进哪几条伏笔改由 LLM 选——旧实现是代码按固定条数切（领域层合格集），且取材发生在上下文组装阶段 ⇒ 七段剧本在伏笔进上下文之前就定稿了，伏笔永远影响不了剧本；现在取材提前到剧本定稿之前、结果挂 ctx.foreshadow_context，剧本与正文上下文用同一份；AI 选中的条目带「本章怎么推进」；核心伏笔 AI 漏选由代码补回并标记，候选 id 白名单防止 AI 凭空造伏笔；AI 不可用时回落领域层合格集（来源可分辨）；v5.21.0: 新增 plot-point-classification 节点（F-08）：剧情点标签与描述改由 LLM 判——旧实现用 Δ≥10/75/55/65/45 阈值表自动贴 CLIMAX/TURNING_POINT 等标签并代写描述（「高潮：张力从 40 跃升至 85」「（需注入冲突）」），那是创作判断被写成了常量；现在 AI 判「是不是剧情点、是哪一类、怎么描述」，代码只校验标签枚举封闭（非法标签⇒ 未评估，不回落成 rising）；未评估 ⇒ 不生成剧情点，不用阈值表兜底；v5.20.0: 新增 character-belief-check 节点（H-03）：角色行为一致性判定改由 LLM 做「信念+行为」蕴含判断——旧实现是关键词表 + 正则（信念含「不信任」就套「轻信」正则，禁忌/旧伤用字面包含判），既漏报又误报；关键词表与正则删除，AI 不可用时返回未评估（valid=null）而不是「符合设定」；v5.19.0: 新增 character-context-selection 节点（D-04）：角色上下文「按章取材」交回 AI——旧实现按固定条数切事实（scars[:2]/motivations[:2]/关系[:2]…），且 T2 措辞对所有角色一字不差；现在 AI 从代码给出的候选清单里挑本章用得上的记忆，并自己写每个角色的 T2 措辞，代码只校验候选 id 白名单（AI 不得凭空造记忆）并保证角色锚点必进；AI 不可用时走代码固定切片（与改造前逐位相同）且来源可分辨；v5.18.0: setting-drift-audit 节点新增 segment_index / segment_total 变量（F-13b）：设定漂移审计改为分段送审——旧实现只送前 12000 字，长章后半段漂移永远审不到却照样返回 audited=True（假通过）；现在按段落边界切段逐段送审、漂移分取各段最大、段数超上限时显式报 coverage=partial 且 drift_score 置 None，不再把「没审完」说成「审过了」；v5.17.0: bible-characters / bible-locations 两个节点新增 importance 与 location_type 输出字段（A-05b）：角色重要度与地点类型改由模型直接给，代码不再用关键词猜（生产库里 4 个「特殊场所」曾被猜成 realm 秘境）；两份 _map_location_kind 合并为一份共享实现；v5.16.0: 新增 planning-macro-calibration 节点（H-06）：宏观诊断的「叙事校准」指令改由 LLM 写，取代代码代写的三套模板句（强化人设/保持张力/延续情绪）；LLM 没给即不注入，代码不代写；scanner 三处构造点补传人物状态仓储，断点不再一律判成 OOC；v5.15.0: 新增 planning-continuation-strategy 节点（D-08）：续不续、从哪续、怎么续由 AI 判断，取代「preview ≥500 字自动切续写模式 + 固定话术」；判不出来即不注入底稿（按全新生成处理），代码不再代写续写指令；v5.14.0: 新增 planning-finale-intent 节点（B-07/B-13）：AI 看全局判断「这一幕是否该收束」并给出本幕创作方向；幕级 brief 里代码代写的两段创作文案改为注入 AI 方向（模型没给就是没给，代码不代写）；终局意图落库到幕节点 metadata，供章节级终局注入读取；v5.13.0: chapter-state-extraction 的 foreshadowing_planted 新增 suggested_resolve_offset 输出字段（G-01 的 AI 优先通道此前因字段缺失而恒走 importance 推算）；resolve_offset 钳位改用 SOURCE_AI_ADJUSTED，被钳的值不再标成 ai；state_updater 的 fallback note 自述实际采用的 +15/+10/+5；v5.12.0: chapter-state-extraction 的 new_storylines 新增 estimated_chapter_end 输出字段，state_updater 链路的 G-03 从无条件 chapter_number + 50 改为「模型优先 + 显式兜底」，G-01 按 importance 推算的 +15/+10/+5 现在带来源标记；v5.11.0: chapter-narrative-sync 的 storyline_progress 新增 estimated_chapter_end 输出字段（G-03 补完：此前 resolve_storyline_end 虽有 ai_end 入参，但全仓无任何可达的 AI 端入参，等于恒走兜底）；v5.10.0: 各部戏剧功能与节奏论改由 AI 给出（B-01），不再由代码预设；v5.9.0: 新增 planning-chapter-mode 节点（D-01），把「本章是否应为余韵章」从代码阈值（tension>=80）交回 AI 判定，判定结果接入 StoryPipeline 的 needs_buffer；v5.8.0: 新增 planning-context-weights 节点（D-02），由 AI 判断本章最需要哪几类记忆并给出槽位权重(0-1)，代码在 tier 预算内换算成 token，硬上限保持为代码不变量；v5.7.0: planning-quick-macro 移除公式推荐网格（建议共 N 部 × 每部 N 卷 × 每卷 N 幕 × 每幕 M 章），部/卷/幕/章的层数与每层章数改由 LLM 依据剧情容量自行决定，唯一硬约束为各级 estimated_chapters 之和等于 target_chapters；rec_parts 等 5 个网格变量模板不再引用，仅保留兼容定义；v5.6.0: 伏笔抽取新增 emotional_weight 与 binding_level 输出字段（chapter-narrative-sync 与 chapter-state-extraction 两条种植路径），支撑 viewpoint_guardrail 的伏笔绑定层级校验；v5.5.0: chapter-narrative-sync 新增 causal_edge_context 变量与 closed_causal_edge_ids 输出，因果边闭环判定从字符串匹配改为 LLM 判定（中文下字符串匹配实测闭环率 0.07%，bigram/滑窗方案同样失效）；v5.4.0: 新增 setting-drift-audit 节点（章后校验正文 vs Bible/FactLock 设定漂移，A1）；v5.3.7: bible-worldbuilding 包声明补齐 fields_desc 与 genre_opening_profile（runtime provider 已提供但契约未声明，修复契约完整性测试）；v5.3.6: 新书引导全面切换到变量中心 dotted key，Bible/主线候选/剧情总纲模板移除运行时代码派生变量与 request.variables 事实源；v5.3.5: 新增情绪账本增量提取节点，移除运行时隐藏硬编码提示词；v5.3.4: 新增章节 AI 审阅节点，场景生成节点补齐 Bible 与检索上下文变量；v5.3.3: 连续规划主链路迁移到 PromptGateway，新增精密宏观规划、单卷补全、缺字段修补和下一幕规划节点；v5.3.2: 补齐 memory-extraction 与 voice-baseline-analysis 包，修复变量契约，接入 PromptGateway 最小契约渲染；v5.3.1: 强化作者原始输入、题材赛道与世界观基调的最高优先级，弱化固定爆款套路；v5.3: 补齐DAG联动节点提示词，提示词广场成为DAG提示词唯一编辑源；v5.2: Bible提示词全面优化；v5.1: 新增outline-beat-partition；v5: CPMS统一架构'
