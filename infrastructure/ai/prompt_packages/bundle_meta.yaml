version: 5.18.0-setting-drift-segmentation
name: PlotPilot 内置
description: CPMS v5 统一提示词库 — 全节点中文提示词、统一注册表、消除硬编码
author: PlotPilot Team
engine: jinja2
changelog: 'v5.18.0: setting-drift-audit 节点新增 segment_index / segment_total 变量（F-13b）：设定漂移审计改为分段送审——旧实现只送前 12000 字，长章后半段漂移永远审不到却照样返回 audited=True（假通过）；现在按段落边界切段逐段送审、漂移分取各段最大、段数超上限时显式报 coverage=partial 且 drift_score 置 None，不再把「没审完」说成「审过了」；v5.17.0: bible-characters / bible-locations 两个节点新增 importance 与 location_type 输出字段（A-05b）：角色重要度与地点类型改由模型直接给，代码不再用关键词猜（生产库里 4 个「特殊场所」曾被猜成 realm 秘境）；两份 _map_location_kind 合并为一份共享实现；v5.16.0: 新增 planning-macro-calibration 节点（H-06）：宏观诊断的「叙事校准」指令改由 LLM 写，取代代码代写的三套模板句（强化人设/保持张力/延续情绪）；LLM 没给即不注入，代码不代写；scanner 三处构造点补传人物状态仓储，断点不再一律判成 OOC；v5.15.0: 新增 planning-continuation-strategy 节点（D-08）：续不续、从哪续、怎么续由 AI 判断，取代「preview ≥500 字自动切续写模式 + 固定话术」；判不出来即不注入底稿（按全新生成处理），代码不再代写续写指令；v5.14.0: 新增 planning-finale-intent 节点（B-07/B-13）：AI 看全局判断「这一幕是否该收束」并给出本幕创作方向；幕级 brief 里代码代写的两段创作文案改为注入 AI 方向（模型没给就是没给，代码不代写）；终局意图落库到幕节点 metadata，供章节级终局注入读取；v5.13.0: chapter-state-extraction 的 foreshadowing_planted 新增 suggested_resolve_offset 输出字段（G-01 的 AI 优先通道此前因字段缺失而恒走 importance 推算）；resolve_offset 钳位改用 SOURCE_AI_ADJUSTED，被钳的值不再标成 ai；state_updater 的 fallback note 自述实际采用的 +15/+10/+5；v5.12.0: chapter-state-extraction 的 new_storylines 新增 estimated_chapter_end 输出字段，state_updater 链路的 G-03 从无条件 chapter_number + 50 改为「模型优先 + 显式兜底」，G-01 按 importance 推算的 +15/+10/+5 现在带来源标记；v5.11.0: chapter-narrative-sync 的 storyline_progress 新增 estimated_chapter_end 输出字段（G-03 补完：此前 resolve_storyline_end 虽有 ai_end 入参，但全仓无任何可达的 AI 端入参，等于恒走兜底）；v5.10.0: 各部戏剧功能与节奏论改由 AI 给出（B-01），不再由代码预设；v5.9.0: 新增 planning-chapter-mode 节点（D-01），把「本章是否应为余韵章」从代码阈值（tension>=80）交回 AI 判定，判定结果接入 StoryPipeline 的 needs_buffer；v5.8.0: 新增 planning-context-weights 节点（D-02），由 AI 判断本章最需要哪几类记忆并给出槽位权重(0-1)，代码在 tier 预算内换算成 token，硬上限保持为代码不变量；v5.7.0: planning-quick-macro 移除公式推荐网格（建议共 N 部 × 每部 N 卷 × 每卷 N 幕 × 每幕 M 章），部/卷/幕/章的层数与每层章数改由 LLM 依据剧情容量自行决定，唯一硬约束为各级 estimated_chapters 之和等于 target_chapters；rec_parts 等 5 个网格变量模板不再引用，仅保留兼容定义；v5.6.0: 伏笔抽取新增 emotional_weight 与 binding_level 输出字段（chapter-narrative-sync 与 chapter-state-extraction 两条种植路径），支撑 viewpoint_guardrail 的伏笔绑定层级校验；v5.5.0: chapter-narrative-sync 新增 causal_edge_context 变量与 closed_causal_edge_ids 输出，因果边闭环判定从字符串匹配改为 LLM 判定（中文下字符串匹配实测闭环率 0.07%，bigram/滑窗方案同样失效）；v5.4.0: 新增 setting-drift-audit 节点（章后校验正文 vs Bible/FactLock 设定漂移，A1）；v5.3.7: bible-worldbuilding 包声明补齐 fields_desc 与 genre_opening_profile（runtime provider 已提供但契约未声明，修复契约完整性测试）；v5.3.6: 新书引导全面切换到变量中心 dotted key，Bible/主线候选/剧情总纲模板移除运行时代码派生变量与 request.variables 事实源；v5.3.5: 新增情绪账本增量提取节点，移除运行时隐藏硬编码提示词；v5.3.4: 新增章节 AI 审阅节点，场景生成节点补齐 Bible 与检索上下文变量；v5.3.3: 连续规划主链路迁移到 PromptGateway，新增精密宏观规划、单卷补全、缺字段修补和下一幕规划节点；v5.3.2: 补齐 memory-extraction 与 voice-baseline-analysis 包，修复变量契约，接入 PromptGateway 最小契约渲染；v5.3.1: 强化作者原始输入、题材赛道与世界观基调的最高优先级，弱化固定爆款套路；v5.3: 补齐DAG联动节点提示词，提示词广场成为DAG提示词唯一编辑源；v5.2: Bible提示词全面优化；v5.1: 新增outline-beat-partition；v5: CPMS统一架构'
