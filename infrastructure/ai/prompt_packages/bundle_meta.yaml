version: 5.40.0-b05-structure-proposal
name: PlotPilot 内置
description: CPMS v5 统一提示词库 — 全节点中文提示词、统一注册表、消除硬编码
author: PlotPilot Team
engine: jinja2
changelog: 'v5.40.0: 结构网格改由 AI 提案（B-05）：此前「精密」模式的结构网格是**代码/前端定的**——StructurePreference 默认 3×3×3，_build_precise_structure_skeleton 按 parts×vpp×apv 铺死整棵树，提示词还双重锁定它（「结构网格绝对服从…不得新增、删除、合并或拆分节点」+「你的任务只是为固定节点填写标题」）⇒ 「这本书该分几部、每部几卷、每卷几幕」这个创作判断被写成了一条常量；而且精密模式在生产上**根本没有前端入口**（SSE 路由固定传 structure_preference=None ⇒ 走的是快捷模式）。现在新节点 planning-structure-proposal 让 AI 看题材/梗概/目标章数**提案网格**，代码**夹紧**提案（不变量：结构深度上限每层 ≤ 10、防无限嵌套 —— 幕数总数 ≤ 目标章数，三层依次压到装得下；被夹时 clamped=True 不许静默），精密模式按这个网格填充内容，最后由用户在规划弹窗**确认**后落库；AI 不可用/输出不合契约/没给出三个可用数字 ⇒ 记为**未评估**并回落代码兜底 3×3×3（与改造前逐位一致）；SSE 路由新增 mode=precise（前端规划弹窗多一个模式切换），MacroPlanRequest.structure 改成**可选**（此前默认 3×3×3 = 代码替用户做决定）；合并时未知 node_id 不再**静默丢弃**而是告警。 v5.39.0: 章前剧本的结构由 AI 选（七段降为可选契约之一，E-01b）：此前「七段执行剧本」的**结构词汇表**是代码写死的（渲染器把固定七个字段映射成固定七段标题）—— 不适用的段也得占位（模型没填就渲染成「（待补充）」，生产库 592 章里 14 章命中：「主角状态变化」空 14 次、「角色关键决策」空 9 次、「爽点/反转设计」空 9 次），而纯对白章、闪回章、揭密章根本没有地方可写；现在模型可以在 chapter_plan.plan_sections 里自选段落，空段不再渲染（不再有代码代写的占位符），段落序号由代码重新编号（不留断号）；**代码保留的不变量「大纲必须落地」**（登记表 E-01）：渲染结果必须至少有一段有内容，否则不落空细纲；正文提示词改为结构无关锚定（按「细纲里列出的段落/条目」落地，对七段剧本逐条核对过语义等价）；开关 config/performance.yaml 的 chapter_plan_structure.enabled **默认关闭**—— 关闭时渲染与章前剧本提示词逐位一致（这一改会让每一章的细纲形状与正文锚定方式一起变，一次全量生效没法小范围观察质量）。 v5.38.0: 建幕时由 AI 声明所属卷（B-08）：此前「换卷时机」是代码按幕数计数的规则（锚点卷幕数达到 rec_acts_per_volume 才换卷、只向后不回填）—— 创作判断被写成了计数规则；现在新节点 planning-act-volume-placement 让 AI 看全书各卷、上一幕与锚点约束，声明这一幕属于第几卷；代码保留两条不变量：卷号单调、不回填（AI 声明的卷号必须落在「锚点卷及之后」的允许集合内，越界即拒收并回落代码选卷策略）；AI 不可用或判不出来一律记为未评估并回落代码策略（与改造前逐位一致）；选卷策略与不变量校验共用同一个锚点实现（resolve_volume_anchor），避免两边口径漂移；挂载留痕（来源、声明卷号、依据、拒绝原因）随新幕落库，来源可分辨。首幕不问 AI：它的父卷由结构决定，不是换卷时机。 v5.37.0: 规划深度档位改由 AI 自评（B-06）：此前档位是**目标章数的纯函数**（>500→framework / >100→partial / 否则 full），而深度决定的是**要求模型输出的结构精细度**（三套 JSON schema）⇒ 档位既不是创作判断，也没法按这本书的实际形态调；现在新节点 planning-depth-assessment 让 AI 看题材/梗概/目标章数，自评「这本书的结构要铺到多细」；**硬约束保留**：章数给出的档位变成**上限**（能到多细），不许选比上限更细的档（防 schema 过大撑爆上下文），被夹时 clamped=True 不许静默；AI 不可用 ⇒ 用章数阈值那档（与改造前逐位一致），来源标 threshold。v5.36.0: 部级章数分配改由 AI 给（B-02）：此前「全书怎么分给各部」是**代码代做**的——_calculate_chapter_distribution 按固定比例算（三部 25/50/25、四部 20/30/30/20、5+ 部首尾 20% 中间平分），再把结果**逐部喂给模型**（「- 第N部：分配 X 章」），而 precise 模式的提示词还明写「Part 只需填 node_id/title/description」⇒ 模型既不能决定、也说不出各部轻重；现在提示词只给**事实**（全书共 N 章、分给 P 部、总幕数、平均每幕），**每部多少章由 AI 定**（要求里写明各部之和必须等于总章数）；骨架给 part 节点留**兜底** estimated_chapters（公式值，AI 没给时用）；合并后核对部级之和 ⇒ 不符只**告警**、**不改写**（与幕级 B-03 同纪律）。v5.35.0: 新增 planning-rhythm-quota 节点（E-06）：题材节奏配额改由 AI 定——此前「本章该多紧、怎么写」是**代码代做**的：黄金三章配额表（第 1 章 ≥65 / 第 2 章 ≥55 / 第 3 章 ≥60）+ 按前章张力的四档（≤30 / ≤45 / ≥80 / ≥65），整套创作指令与目标数字都写死在代码里，而题材不同该多紧根本不是同一套；现在 AI 依题材/本章位置/前章实际张力给出目标张力 + 节奏档 + 一句具体指令，代码只做不越界校验（目标张力 0-100 整数 / 节奏档封闭枚举 / 指令不得为空）；AI 不可用时回落代码表（文案与目标数字**逐位一致**），来源可分辨；另：chapter-prose-generation 新增独立变量 rhythm_quota（此前 plot_tension 在 base.py 里算完即丢 ⇒ 张力配额在生产上到不了模型），但**受 config/performance.yaml 的 rhythm_quota.enabled 控制（默认关闭）**⇒ 行为与改造前逐位一致（突然激活一个从未生效的硬约束会一次性改变全书节奏观）。v5.34.0: voice-rewrite 节点输出改为 JSON，并回传「下一轮换什么手法」（E-03）：此前该节点**只输出改写后的正文**（纯文本）⇒ 第 2 轮改写时模型**不知道上一轮为什么没达标**，只能换个说法再改一遍 ⇒ 最多 3 轮 = 最多 3 次盲改；现在输出 JSON（rewritten / diagnosis / next_technique），两条改写链（StoryPipeline 的 base.py 与 daemon 的 daemon_host.py）都把上一轮的 diagnosis 与 next_technique 作为新变量（previous_diagnosis / previous_next_technique）回传给下一轮；模型没给 JSON 时**原样当正文**（改造前的行为），结构化字段为空 ⇒ 下一轮如实为空、不编；另：config/performance.yaml 的 autopilot.voice_rewrite 段（max_attempts / threshold / warning_threshold）**全仓无人读取** ⇒ 已删（那三个值在代码里有真来源：BaseStoryPipeline 的类属性，支持子类覆盖）。v5.33.0: 正文采样参数收口 + 消掉生产提示词里的风格法则矛盾（E-07）：① 正文生成的 temperature 此前在 **5 个正文生成点**写死 0.85（prose_composer ×2 / daemon_host ×1 / legacy_writing_delegate ×2）⇒ 改一次要改 5 处；现在唯一来源是 config/performance.yaml 的 prose_sampling 段（默认 0.85 ⇒ 行为逐位不变）；② chapter-prose-generation 的「短剧短句行文：**全程使用超短段落**」与同一份生产上下文里的「全章独段比例不得超过 15%」（rule_parser 经 context_budget_allocator 注入）**直接矛盾**，且前者优先级最高 ⇒ 该条改为不冲突的「长短段交替」措辞，15% 那个口径保留（它在 9 处、且真的进了生产上下文）。v5.32.0: planning-chapter-preplan 的数量区间与阶段枚举放宽为软建议（E-05）：此前 user.md 把「key_plot_points 5-10 个」「key_dialogues 4-8 组」「event_chain 6-10 个」「phase 只能用 触发、升级、爆发、收束」写成硬要求，但**代码零校验**（preplan 服务只验「chapter_plan 是对象」与「七段渲染得出来」）⇒ 模型只能去凑这些没有依据的数字；且 key_plot_points 在模型没给时是从 event_chain 反推的**派生物**，「5-10 个」就算被强校验也只约束那个派生物；event_chain 的 phase **没有任何代码消费者**（format_event 只把它显示成「事件N（phase）」）。现在三处数量都改成「通常是 N 个，按本章实际分量给，不必凑数」，phase 改成「建议用触发/升级/爆发/收束，更贴切的说法也可以，不要为了凑枚举硬套」；**七段结构契约仍是硬的**（E-01 不变）。v5.31.0: 新增 wuxia-style-audit 节点（E-04）：武侠题材的「战斗逻辑」与「现代口语」判定改由 LLM 审——此前是代码用两条正则（「一招秒杀」）+ 恰 7 个词的现代语黑名单判的，词表外的写法一律漏报，而真正违反战斗逻辑的写法反而抓不到；现在 AI 看本章正文判断「有没有违反武功逻辑」「有没有现代口语」，代码只做不越界校验（type 封闭枚举 / 证据必须逐字出现在正文里 / 有结论必须有依据）；AI 不可用时回落代码表（改造前逐位一致），来源可分辨；另：武侠管线删掉 4 个从未生效的常量（DEFAULT_TARGET_WORDS=3000 / MIN_PASS_SCORE=0.55 / COMBAT_SCENE_MAX_WORDS / CULTIVATION_DETAIL_LEVEL）——生产的章节目标字数取自 StoryPipelineRunner（基类 2500），质量门槛真值是 policy_validator / quality_guardrail 的 0.6，那个 0.55 从未被读 ⇒「武侠门槛更低」是假的；v5.30.0: 新增 evolution-dead-character-check 节点（H-01）：死亡角色在大纲里的出场方式改由 AI 判——此前闸门的 DEAD_CHARACTER_REAPPEARS 规则只看「名字有没有出现在大纲里」⇒「回忆 / 遗物 / 传闻」一律被误判成「活跃登场」（而规则自己的建议「改为回忆/遗物/传闻」并不能满足它，规则自相矛盾）；现在 AI 看大纲上下文判断「他在当下时间线行动」还是「只是被想起」；代码只做不越界校验（角色白名单 / verdict 封闭枚举 / 有结论必须有依据）；AI 判不出 ⇒ 显式 level=unassessed（不等于「没违规」，报告里 unassessed_count 可数）；AI 不可用 ⇒ 回落规则判定（命中即拦，与改造前逐位一致，不放宽闸门）；闸门 check() 保持同步（三个调用点里有一个在纯同步方法里），AI 判定走新增的 check_with_ai / classify_dead_characters（async 侧调用方下传）；v5.29.0: 新增 planning-macro-breakpoint 节点（H-06 子项 A）：宏观诊断的**断点分类**改由 AI 判——此前「哪些事件偏离了人设、属于哪一类」全由代码判：发现靠一张写死 4 个人设标签的标签求交表（表外的人设一个断点都发现不了，而生产路径恰好只扫那 4 个标签 ⇒ 诊断对象与本书角色无关），分类靠 scar/执念两条规则、其余一律落 OOC（含「没有人物状态仓储 / 提不出角色 / 没有角色状态 / 没找到触发原因」这四种信息不足的情形 ⇒ 把「判不出」说成了「人设崩塌」）；现在 AI 看角色档案（人设/伤疤/执念）与最近的事件清单来判断，代码只做不越界校验（事件白名单 / 角色白名单 / verdict 封闭枚举 / 有结论必须有依据）；规则判不出的一律落新的 UNASSESSED（未评估），不再落 OOC；AI 不可用时回落规则判定且来源可分辨（breakpoint_source = ai / rule / 未评估）；另：planning-macro-calibration 送进提示词的断点字段名由「规则分类」改为「分类 + 分类来源」（分类现在可能来自 AI）；v5.28.0: 新增 planning-first-act 节点（C-07）：全书首幕的标题/描述/建议章数改由 AI 决定——此前 daemon 动态补首幕时这三项全部代码写死（「第一幕 · 开端」「故事起始，建立世界观与主角目标」+ 公式章数），创作判断被写成了常量；AI 不可用时落代码兜底文案，且落库来源如实保持 DRAFT/MANUAL（不标成 AI 规划好的）；v5.27.0: 新增 planning-target-budget-proposal 节点（J-01）：目标章数与终局预算的提案改由 AI 给——此前是代码写死的常量公式（max(20, round(target*0.2))），而「这本书还差多少章收得住」「终局该留几章」是创作判断；AI 不可用或说不出来时回落引擎默认公式（与改造前逐位相同），并用 source 标出 ai / fallback；终局预算的 [5,200] 上限仍由 domain 钳制，AI 动不了；v5.26.0: F-12 机械活 —— ① 8 个内置提示词包的 `source:` 指向**已不存在的**`infrastructure/ai/prompts/prompts_defaults.json`（提示词早已迁到 CPMS），该字段会透出到提示词广场 ⇒ 读者看到的是假来源；现改指真实归属文件；② 全仓「35+ 模式」这个旧数改正为「50+」（扫描器实测 51 条内置模式，「35+」是早期 10 条时代的遗留说法）；v5.25.0: chapter-prose-generation 节点新增 chapter_context 变量（X1）：生产正文提示词此前只有 target_words / chapter_outline / continuity_context 三个变量，且「近3章承接摘要」与「硬事实」挤在同一个槽位（continuity_context）——前者恒非空（continuity ledger 空时返回「暂无近3章承接摘要。」）⇒ 后者永远进不了提示词 ⇒ 模型写正文时看不见死亡锁、角色当前状态、创作契约；现在硬事实独立成 chapter_context 变量（与 continuity_context 分开），且**只送槽位级的硬事实小块**（默认：绝对事实边界 / 角色锚点 / 创作契约，每块带上限）——不送整包：正文模板的硬约束是「以七段结构为唯一剧情骨架」，且整包实测 6.9k~19.4k token/章（其中 fact_lock 在 529 章本上就有 20365 字，它自己在无上限地长）；槽位与上限见 config/performance.yaml 的 prose_context 段；v5.24.0: 新增 conflict-action-extraction 节点（H-02b）：冲突检测的「实体-动作对」改由 LLM 抽——旧实现是代码用一张写死的关键词表猜（「火球」「拔剑」…共 12 条），表里没有的写法一律漏报，且「什么算用了火系魔法」是代码代做的语义判断；现在 AI 看大纲抽出「谁做了什么」（kind 封闭枚举：magic/weapon；魔法值统一「X系」形式，与设定库 magic_type 同口径；武器值写武器名），代码只做不越界校验（实体白名单、kind 封闭枚举、值格式、证据必须字面出现在大纲里）；AI 合法地说「这段没有动作」不算未评估、不回退，调用失败/输出不合契约/给的全是废数据 ⇒ 未评估 ⇒ 回落代码关键词表（与改造前逐位一致）且来源可分辨；v5.23.0: 新增 anti-ai-pattern-induction 节点（F-06）：「本书特有的 AI 味表达」改由 LLM 归纳——旧实现是代码用 6 个固定模板正则 + 7 个固定触发词做统计，那不是学习，且「什么算 AI 味」本身是代码代做的语义判断；现在代码只做不越界校验（纯字面关键词、必须在本章正文里确实出现、严重度白名单），通过的规则落库（新表 anti_ai_learned_patterns，规则库版本化）并回灌进扫描器 ⇒ 归纳出来的模式下一章起真的会被检测到；AI 不可用时不产生任何模式；v5.22.0: 新增 foreshadow-selection 节点（D-03 P1）：本章该推进哪几条伏笔改由 LLM 选——旧实现是代码按固定条数切（领域层合格集），且取材发生在上下文组装阶段 ⇒ 七段剧本在伏笔进上下文之前就定稿了，伏笔永远影响不了剧本；现在取材提前到剧本定稿之前、结果挂 ctx.foreshadow_context，剧本与正文上下文用同一份；AI 选中的条目带「本章怎么推进」；核心伏笔 AI 漏选由代码补回并标记，候选 id 白名单防止 AI 凭空造伏笔；AI 不可用时回落领域层合格集（来源可分辨）；v5.21.0: 新增 plot-point-classification 节点（F-08）：剧情点标签与描述改由 LLM 判——旧实现用 Δ≥10/75/55/65/45 阈值表自动贴 CLIMAX/TURNING_POINT 等标签并代写描述（「高潮：张力从 40 跃升至 85」「（需注入冲突）」），那是创作判断被写成了常量；现在 AI 判「是不是剧情点、是哪一类、怎么描述」，代码只校验标签枚举封闭（非法标签⇒ 未评估，不回落成 rising）；未评估 ⇒ 不生成剧情点，不用阈值表兜底；v5.20.0: 新增 character-belief-check 节点（H-03）：角色行为一致性判定改由 LLM 做「信念+行为」蕴含判断——旧实现是关键词表 + 正则（信念含「不信任」就套「轻信」正则，禁忌/旧伤用字面包含判），既漏报又误报；关键词表与正则删除，AI 不可用时返回未评估（valid=null）而不是「符合设定」；v5.19.0: 新增 character-context-selection 节点（D-04）：角色上下文「按章取材」交回 AI——旧实现按固定条数切事实（scars[:2]/motivations[:2]/关系[:2]…），且 T2 措辞对所有角色一字不差；现在 AI 从代码给出的候选清单里挑本章用得上的记忆，并自己写每个角色的 T2 措辞，代码只校验候选 id 白名单（AI 不得凭空造记忆）并保证角色锚点必进；AI 不可用时走代码固定切片（与改造前逐位相同）且来源可分辨；v5.18.0: setting-drift-audit 节点新增 segment_index / segment_total 变量（F-13b）：设定漂移审计改为分段送审——旧实现只送前 12000 字，长章后半段漂移永远审不到却照样返回 audited=True（假通过）；现在按段落边界切段逐段送审、漂移分取各段最大、段数超上限时显式报 coverage=partial 且 drift_score 置 None，不再把「没审完」说成「审过了」；v5.17.0: bible-characters / bible-locations 两个节点新增 importance 与 location_type 输出字段（A-05b）：角色重要度与地点类型改由模型直接给，代码不再用关键词猜（生产库里 4 个「特殊场所」曾被猜成 realm 秘境）；两份 _map_location_kind 合并为一份共享实现；v5.16.0: 新增 planning-macro-calibration 节点（H-06）：宏观诊断的「叙事校准」指令改由 LLM 写，取代代码代写的三套模板句（强化人设/保持张力/延续情绪）；LLM 没给即不注入，代码不代写；scanner 三处构造点补传人物状态仓储，断点不再一律判成 OOC；v5.15.0: 新增 planning-continuation-strategy 节点（D-08）：续不续、从哪续、怎么续由 AI 判断，取代「preview ≥500 字自动切续写模式 + 固定话术」；判不出来即不注入底稿（按全新生成处理），代码不再代写续写指令；v5.14.0: 新增 planning-finale-intent 节点（B-07/B-13）：AI 看全局判断「这一幕是否该收束」并给出本幕创作方向；幕级 brief 里代码代写的两段创作文案改为注入 AI 方向（模型没给就是没给，代码不代写）；终局意图落库到幕节点 metadata，供章节级终局注入读取；v5.13.0: chapter-state-extraction 的 foreshadowing_planted 新增 suggested_resolve_offset 输出字段（G-01 的 AI 优先通道此前因字段缺失而恒走 importance 推算）；resolve_offset 钳位改用 SOURCE_AI_ADJUSTED，被钳的值不再标成 ai；state_updater 的 fallback note 自述实际采用的 +15/+10/+5；v5.12.0: chapter-state-extraction 的 new_storylines 新增 estimated_chapter_end 输出字段，state_updater 链路的 G-03 从无条件 chapter_number + 50 改为「模型优先 + 显式兜底」，G-01 按 importance 推算的 +15/+10/+5 现在带来源标记；v5.11.0: chapter-narrative-sync 的 storyline_progress 新增 estimated_chapter_end 输出字段（G-03 补完：此前 resolve_storyline_end 虽有 ai_end 入参，但全仓无任何可达的 AI 端入参，等于恒走兜底）；v5.10.0: 各部戏剧功能与节奏论改由 AI 给出（B-01），不再由代码预设；v5.9.0: 新增 planning-chapter-mode 节点（D-01），把「本章是否应为余韵章」从代码阈值（tension>=80）交回 AI 判定，判定结果接入 StoryPipeline 的 needs_buffer；v5.8.0: 新增 planning-context-weights 节点（D-02），由 AI 判断本章最需要哪几类记忆并给出槽位权重(0-1)，代码在 tier 预算内换算成 token，硬上限保持为代码不变量；v5.7.0: planning-quick-macro 移除公式推荐网格（建议共 N 部 × 每部 N 卷 × 每卷 N 幕 × 每幕 M 章），部/卷/幕/章的层数与每层章数改由 LLM 依据剧情容量自行决定，唯一硬约束为各级 estimated_chapters 之和等于 target_chapters；rec_parts 等 5 个网格变量模板不再引用，仅保留兼容定义；v5.6.0: 伏笔抽取新增 emotional_weight 与 binding_level 输出字段（chapter-narrative-sync 与 chapter-state-extraction 两条种植路径），支撑 viewpoint_guardrail 的伏笔绑定层级校验；v5.5.0: chapter-narrative-sync 新增 causal_edge_context 变量与 closed_causal_edge_ids 输出，因果边闭环判定从字符串匹配改为 LLM 判定（中文下字符串匹配实测闭环率 0.07%，bigram/滑窗方案同样失效）；v5.4.0: 新增 setting-drift-audit 节点（章后校验正文 vs Bible/FactLock 设定漂移，A1）；v5.3.7: bible-worldbuilding 包声明补齐 fields_desc 与 genre_opening_profile（runtime provider 已提供但契约未声明，修复契约完整性测试）；v5.3.6: 新书引导全面切换到变量中心 dotted key，Bible/主线候选/剧情总纲模板移除运行时代码派生变量与 request.variables 事实源；v5.3.5: 新增情绪账本增量提取节点，移除运行时隐藏硬编码提示词；v5.3.4: 新增章节 AI 审阅节点，场景生成节点补齐 Bible 与检索上下文变量；v5.3.3: 连续规划主链路迁移到 PromptGateway，新增精密宏观规划、单卷补全、缺字段修补和下一幕规划节点；v5.3.2: 补齐 memory-extraction 与 voice-baseline-analysis 包，修复变量契约，接入 PromptGateway 最小契约渲染；v5.3.1: 强化作者原始输入、题材赛道与世界观基调的最高优先级，弱化固定爆款套路；v5.3: 补齐DAG联动节点提示词，提示词广场成为DAG提示词唯一编辑源；v5.2: Bible提示词全面优化；v5.1: 新增outline-beat-partition；v5: CPMS统一架构'
