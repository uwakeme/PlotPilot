changelog: 'v5.6.0: 伏笔抽取新增 emotional_weight 与 binding_level 输出字段（chapter-narrative-sync 与 chapter-state-extraction 两条种植路径），支撑 viewpoint_guardrail 的伏笔绑定层级校验；v5.5.0: chapter-narrative-sync 新增 causal_edge_context 变量与 closed_causal_edge_ids 输出，因果边闭环判定从字符串匹配改为 LLM 判定（中文下字符串匹配实测闭环率 0.07%，bigram/滑窗方案同样失效）；v5.4.0: 新增 setting-drift-audit 节点（章后校验正文 vs Bible/FactLock 设定漂移，A1）；v5.3.7: bible-worldbuilding 包声明补齐 fields_desc 与 genre_opening_profile（runtime provider 已提供但契约未声明，修复契约完整性测试）；v5.3.6: 新书引导全面切换到变量中心 dotted key，Bible/主线候选/剧情总纲模板移除运行时代码派生变量与 request.variables 事实源；v5.3.5: 新增情绪账本增量提取节点，移除运行时隐藏硬编码提示词；v5.3.4: 新增章节 AI 审阅节点，场景生成节点补齐 Bible 与检索上下文变量；v5.3.3: 连续规划主链路迁移到 PromptGateway，新增精密宏观规划、单卷补全、缺字段修补和下一幕规划节点；v5.3.2: 补齐 memory-extraction 与 voice-baseline-analysis 包，修复变量契约，接入 PromptGateway 最小契约渲染；v5.3.1: 强化作者原始输入、题材赛道与世界观基调的最高优先级，弱化固定爆款套路；v5.3: 补齐DAG联动节点提示词，提示词广场成为DAG提示词唯一编辑源；v5.2: Bible提示词全面优化；v5.1: 新增outline-beat-partition；v5: CPMS统一架构'
