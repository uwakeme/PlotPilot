name: 章前执行剧本规划
category: planning
source: application/blueprint/services/chapter_preplanning_service.py
description: 在正文写作前，将单章轻量主事件链和前3章规划上下文落地为七段章节执行剧本。
builtin: true
tags:
- 规划
- 章前
- JSON输出
output_format: json
variables:
- name: chapter_number
  desc: 全书章节号
  type: integer
  required: true
- name: chapter_title
  desc: 章节标题
  type: string
  required: true
- name: act_chapter_plan
  desc: 幕级轻量主事件链中的本章数据
  type: string
  required: true
- name: continuity_context
  desc: 连续性上下文，使用近3章承接摘要
  type: string
  required: true
- name: pacing_directive
  desc: AI 判定本章为余韵章时的节奏指令；空串表示不施加任何节奏约束
  type: string
  required: false
- name: finale_directive
  desc: 终局阶段的收束方向（进入终局这一事实 + 该幕落库的 AI 方向）；空串表示不施加任何终局约束
  type: string
  required: false
- name: foreshadow_context
  desc: 本章应推进的伏笔清单（AI 选的）；空串表示本章没有待推进的伏笔
  type: string
  required: false
id: planning-chapter-preplan
sort_order: 25
