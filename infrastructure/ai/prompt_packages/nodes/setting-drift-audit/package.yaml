name: 设定漂移审计
category: review
source: application/audit/services/setting_drift_audit.py
description: 章后校验正文是否违反 Bible 世界观与 FactLock 锁定事实（能力/地名/规则漂移）
builtin: true
tags:
- 审计
- 一致性
output_format: json
variables:
- name: novel_title
  desc: 小说名称
  type: string
- name: chapter_number
  desc: 章节号
  type: integer
- name: setting_facts
  desc: 基准事实清单（世界观/地点/FactLock 锁定事实的 JSON 文本）
  type: string
  required: true
- name: chapter_content
  desc: 章节正文（长章按段送审，本变量只装本段）
  type: string
  required: true
- name: segment_index
  desc: 本次送审的正文段序号（从 1 开始）
  type: integer
  required: true
- name: segment_total
  desc: 本章正文总段数（1 表示整章一次性送审）
  type: integer
  required: true
id: setting-drift-audit
sort_order: 107
