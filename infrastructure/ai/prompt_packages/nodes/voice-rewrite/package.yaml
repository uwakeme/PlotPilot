- name: anchor_block
  desc: Character voice anchor points
  type: string
  required: true
- name: chapter_number
  desc: Current chapter number
  type: integer
  required: true
- name: attempt
  desc: Rewrite attempt number
  type: integer
  required: true
- name: similarity_score
  desc: Current style similarity score
  type: string
  required: true
- name: threshold
  desc: Auto-rewrite trigger threshold
  type: string
  required: true
- name: outline
  desc: Chapter outline
  type: string
  required: true
- name: content
  desc: Current chapter content to rewrite
  type: string
  required: true
- name: previous_diagnosis
  desc: 上一轮模型自评的「为什么没达标」（首轮为空）
