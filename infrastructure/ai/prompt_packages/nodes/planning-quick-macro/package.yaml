name: 极速宏观规划 · 源设定优先
category: planning
source: application/blueprint/services/continuous_planning_service.py::_build_quick_macro_prompt
description: 极速模式下的长篇宏观结构规划，按目标篇幅动态选择部、卷、幕粒度，并优先服从作者原始设定。
builtin: true
tags:
- 宏观规划
- 极速模式
- 源设定优先
output_format: json
variables:
- name: premise
  desc: 作者原始梗概或核心创意
  type: string
  default: ''
- name: target_chapters
  desc: 目标总章节数
  type: integer
  required: true
- name: worldview
  desc: 世界观、地点、时间线等设定块
  type: string
  default: ''
- name: worldbuilding.content
  desc: 世界观与时间线设定块（兼容嵌套模板变量）
  type: string
  default: ''
- name: locations.list
  desc: 关键地点列表（兼容嵌套模板变量）
  type: string
  default: ''
- name: characters
  desc: 主要角色与关系设定块
  type: string
  default: ''
- name: genre_opening_profile
  desc: 新书引导解析出的类型开篇画像
  type: object
  default: {}
- name: genre_reader_contract
  desc: 新书引导解析出的读者留存契约
  type: object
  default: {}
- name: genre_rhythm_constraints
  desc: 新书引导解析出的类型节奏约束
  type: object
  default: {}
- name: planning_depth
  desc: 规划深度：framework、partial 或 full
  type: string
  default: full
# 以下 5 个变量曾是"公式推荐网格"（多少字→多少章）。结构层数改由 LLM 依据剧情
# 容量自行决定后，模板已不再引用它们；保留定义仅为兼容旧变量绑定与旧模板。
- name: rec_parts
  desc: （已废弃）公式推荐部数，模板不再引用
  type: integer
  default: 1
- name: rec_volumes_per_part
  desc: （已废弃）公式推荐每部卷数，模板不再引用
  type: integer
  default: 1
- name: rec_acts_per_volume
  desc: （已废弃）公式推荐每卷幕数，模板不再引用
  type: integer
  default: 1
- name: rec_chapters_per_act
  desc: （已废弃）公式推荐每幕章数，模板不再引用
  type: integer
  default: 1
- name: total_recommended_acts
  desc: （已废弃）公式推荐总幕数，模板不再引用
  type: integer
  default: 1
id: planning-quick-macro
sort_order: 19
