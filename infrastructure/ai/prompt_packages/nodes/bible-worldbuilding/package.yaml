name: 世界观与文风生成
category: world
source: application/world/services/auto_bible_generator.py
description: 沿用 Plotpilot_writer 五维基础字段契约生成世界观
builtin: true
tags:
- 世界观
- 文风
output_format: json
variables:
- name: premise
  desc: 故事创意
  type: string
- name: novel_title
  desc: 小说名称
  type: string
- name: fields_desc
  desc: 五维世界观字段的动态 JSON 骨架（worldbuilding_schema.build_fields_desc_for_prompt 注入）
  type: string
- name: genre_opening_profile
  desc: 类型开篇画像（prompt_runtime 提供，预留 genre 契约注入）
  type: string
- name: genre_major
  desc: 小说大类
  type: string
- name: genre_theme
  desc: 小说主题
  type: string
- name: genre_label
  desc: 小说类型字符串
  type: string
- name: world_preset
  desc: 世界观基调
  type: string
- name: special_requirements
  desc: 特殊要求
  type: string
id: bible-worldbuilding
sort_order: 27
