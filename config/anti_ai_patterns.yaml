version: 1
'#': '反 AI 俗套检测的**规则清单**（第 77 批从 cliche_scanner.py 搬到这里）。

  ⚠ 正则是「怎么判」，分类学是「判出来算什么」——分类学在 config/anti_ai_taxonomy.yaml（另一份 SSOT）。

  格式：regex / name / severity / category / hint；category 必须是词表里的中文分类（见 taxonomy 的 code_only_categories 与 scanner_categories）。'
patterns:
- regex: 熊熊(烈火|怒火|火焰|燃烧)
  name: 熊熊系列
  severity: warning
  category: 俗套
  hint: 用具体描写替代
- regex: (眼中|眸中|目光中)闪过一丝
  name: 眼神闪过系列
  severity: critical
  category: 微表情
  hint: 用对话或动作替代
- regex: 嘴角(勾起|扬起|浮现|上扬).*?[笑弧]
  name: 嘴角笑意系列
  severity: critical
  category: 微表情
  hint: 写完整姿态变化或不写
- regex: (心中|内心)五味杂陈
  name: 五味杂陈系列
  severity: warning
  category: 情绪
  hint: 通过动作暗示
- regex: 如同.{1,10}一般
  name: 如同一般系列
  severity: critical
  category: 比喻
  hint: 用感官细节替代比喻
- regex: (眼神|目光|气势).{0,3}(变得|显得|愈发)?凌厉
  name: 凌厉系列
  severity: warning
  category: 俗套
  hint: 用具体描写替代
- regex: (眼神|目光|眼中).{0,5}复杂
  name: 复杂眼神系列
  severity: warning
  category: 微表情
  hint: 用具体动作替代
- regex: (内心|心中).{0,5}(泛起|涌起|掀起).{0,5}波澜
  name: 心中波澜系列
  severity: critical
  category: 情绪
  hint: 通过动作暗示
- regex: (眼神|目光|眼眸).{0,3}(深邃|幽深)
  name: 深邃眼神系列
  severity: warning
  category: 俗套
  hint: 用具体描写替代
- regex: (嘴角|脸上|眼中).{0,3}(浮现|闪过|掠过)一抹
  name: 一抹系列
  severity: warning
  category: 俗套
  hint: 用具体动作替代
- regex: 嘴角(勾起|上扬|扬起|浮现|翘起)
  name: 嘴角微表情
  severity: critical
  category: 微表情
  hint: 写完整姿态变化
- regex: 眼里(闪过|显现出|漾起).{0,6}(光芒|光|星光|温柔)
  name: 眼里闪过
  severity: critical
  category: 微表情
  hint: 用对话或动作替代
- regex: (指尖|指节)(泛白|发白)
  name: 指尖泛白
  severity: critical
  category: 微表情
  hint: 用行为传递紧张感
- regex: (下意识|无意识地?)
  name: 下意识/无意识
  severity: warning
  category: 微表情
  hint: 写完整的动作链
- regex: 一丝.{0,4}(笑意|暖意|寒意|警惕|不易察觉)
  name: 一丝系列
  severity: warning
  category: 微表情
  hint: 要么具体到可感知，要么别写
- regex: 不易察觉
  name: 不易察觉
  severity: warning
  category: 微表情
  hint: 如果不易察觉，读者怎么知道？
- regex: 带着.{1,8}(口吻|语气)
  name: 带语气前缀
  severity: critical
  category: 声线
  hint: 用对白本身的标点和断句表现语气
- regex: (声音|语调).{0,5}(变得|比.{1,4}更).{0,5}(冰冷|低沉|凌厉)
  name: 声线变化
  severity: critical
  category: 声线
  hint: 让对白内容自己说话
- regex: 每一个字都带着
  name: 字字带X
  severity: critical
  category: 声线
  hint: 删掉这句话，让对白自身有力度
- regex: 不容(置疑|置喙)
  name: 不容置疑
  severity: critical
  category: 声线
  hint: 用对白本身的力度表现权威
- regex: 用.{1,6}的语气
  name: 用XX语气
  severity: critical
  category: 声线
  hint: 用对白标点和断句
- regex: 充满了.{1,6}的味道
  name: 充满XX味道
  severity: warning
  category: 声线
  hint: 用对白本身表现
- regex: 声音比.{1,6}更冰冷
  name: 声音比XX冰冷
  severity: critical
  category: 声线
  hint: 删掉，让对白自身有力度
- regex: 话语充满.{1,4}气
  name: 话语充满X气
  severity: warning
  category: 声线
  hint: 用具体用词表现
- regex: (仿佛|宛如|犹如|恰似|酷似).{1,15}(般|一般|似的|一样)
  name: 比喻句式
  severity: critical
  category: 比喻
  hint: 用感官细节替代比喻
- regex: 如同.{1,12}(一般|一样)
  name: 如同比喻
  severity: critical
  category: 比喻
  hint: 用感官细节替代比喻
- regex: .{1,6}像.{1,4}投入.{1,6}(心湖|水面).{0,6}(泛起|荡起|漾起)涟漪
  name: 心湖涟漪
  severity: critical
  category: 比喻
  hint: 禁止此意象，用具体动作
- regex: 投入.{0,6}(心湖|水面)
  name: 投入心湖
  severity: critical
  category: 比喻
  hint: 禁止心湖意象
- regex: (泛起|荡起|漾起)涟漪
  name: 涟漪意象
  severity: critical
  category: 比喻
  hint: 禁止涟漪意象
- regex: 生理性(泪水|水雾|液体|汽水|盐水)
  name: 生理性液体
  severity: critical
  category: 生理
  hint: 直接描述哭泣的差异化写法
- regex: 生理性
  name: 生理性前缀
  severity: critical
  category: 生理
  hint: 删掉'生理性'，直接写反应
- regex: (感到|觉得|心中|内心)(非常|极度|无比)?(愤怒|悲伤|恐惧|厌恶|惊讶|喜悦|痛苦)
  name: 直接情绪标签
  severity: warning
  category: 情绪
  hint: 通过动作/环境暗示
- regex: 不是[^。，？！]{1,20}(而是|只是)
  name: 不是而是句式
  severity: warning
  category: 句式
  hint: 转为直接叙述
- regex: (?<=[^\n])——|——(?=[^\n])
  name: 破折号
  severity: info
  category: 句式
  hint: 正文用句号替代，对话中可保留
- regex: 像(小兔子|小鹿|小猫|小兽|幼兽)
  name: 小动物比喻
  severity: critical
  category: 比喻
  hint: 禁止动物比喻，用具体动作
- regex: 精致人偶
  name: 精致人偶
  severity: critical
  category: 比喻
  hint: 用具体的外貌/姿态描写
- regex: 眸色一沉|眼神暗了暗|眉头微皱|邪魅一笑|似笑非笑
  name: 面部大忌
  severity: critical
  category: 俗套
  hint: 用动作或对白替代
- regex: (眼神|目光).{0,3}冰冷
  name: 眼神冰冷
  severity: critical
  category: 俗套
  hint: 写对话时的具体反应
- regex: 深邃
  name: 深邃
  severity: warning
  category: 俗套
  hint: 删除或用具体描述
- regex: 呼吸一滞|倒吸一口凉气|喉结微滚|浑身一震|身子一僵
  name: 身体大忌
  severity: critical
  category: 俗套
  hint: 用差异化反应替代
- regex: 四肢百骸
  name: 四肢百骸
  severity: critical
  category: 俗套
  hint: 用具体的身体部位描述
- regex: 青筋暴起
  name: 青筋暴起
  severity: critical
  category: 俗套
  hint: 写紧握的物体变形/碎裂
- regex: 死死
  name: 死死
  severity: critical
  category: 严禁词
  hint: 删除或换词
- regex: 毫不夸张地说
  name: 毫不夸张
  severity: warning
  category: 俗套
  hint: 删掉
- regex: (熊熊|滔滔不绝|如同实质般)
  name: 经典俗套
  severity: warning
  category: 俗套
  hint: 用具体描写替代
- regex: 虔诚|膜拜
  name: 虔诚/膜拜
  severity: warning
  category: 俗套
  hint: 用具体行为替代
- regex: '[三四五六七八九]分[^，。]{1,6}[七八九]分'
  name: 数字比喻
  severity: warning
  category: 俗套
  hint: 删除数字量化
- regex: 精密仪器
  name: 精密仪器比喻
  severity: warning
  category: 比喻
  hint: 用具体的精确描述
- regex: 轻描淡写
  name: 轻描淡写
  severity: warning
  category: 俗套
  hint: 写具体的无所谓的动作
- regex: 仿佛一折就断
  name: 仿佛一折就断
  severity: critical
  category: 比喻
  hint: 写具体的脆弱表现
- regex: 角落上扬露出一丝微笑
  name: 嘴角微笑组合
  severity: critical
  category: 微表情
  hint: 写完整姿态或不写
