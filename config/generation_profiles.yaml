# J-01：目标章数 / 终局预算提案。提案是「用户点继续写前看一眼」的前置动作
# ⇒ 超时要短（超时即回落引擎默认公式，用户不能被一个慢模型卡住）。
target_budget_proposal:
  extends: base_generation_profile
  max_tokens: 1200
  temperature: 0.3
  timeout_seconds: 30
  retries: 0

# C-07：全书首幕（标题/描述/章数）。这是**创作内容**，不是分类
# ⇒ 温度略高，且超时不能太长（守护进程在等它）。
planning_first_act:
  extends: base_generation_profile
  max_tokens: 2000
  temperature: 0.6
  timeout_seconds: 60
  retries: 1
